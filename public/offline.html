<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StoryLingo — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09112c;
        color: #f4ecd8;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card { max-width: 22rem; }
      .moon { font-size: 3rem; }
      h1 { font-size: 1.25rem; margin: 0.75rem 0 0.5rem; }
      p { color: #c9c2ac; line-height: 1.5; margin: 0; }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        border: none;
        background: #f7c747;
        color: #09112c;
        font-weight: 700;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="moon" aria-hidden="true">🌙</p>
      <h1>ยังไม่มีอินเทอร์เน็ต</h1>
      <p>
        StoryLingo ยังไม่ได้เชื่อมต่อ ลองเชื่อมต่ออินเทอร์เน็ตอีกครั้ง —
        บทที่เคยอ่านแล้วบางบทอาจเปิดได้อยู่
      </p>
      <button onclick="location.reload()">ลองอีกครั้ง</button>
    </div>
  </body>
</html>
